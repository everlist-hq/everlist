name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull code, write llm.env, restart webchat
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NLU_URL: ${{ secrets.EVERLIST_NLU_API_URL }}
          NLU_KEY: ${{ secrets.EVERLIST_NLU_API_KEY }}
          NLU_MODEL: ${{ secrets.EVERLIST_NLU_MODEL }}
          FB_URL: ${{ secrets.EVERLIST_FALLBACK_API_URL }}
          FB_KEY: ${{ secrets.EVERLIST_FALLBACK_API_KEY }}
          FB_MODEL: ${{ secrets.EVERLIST_FALLBACK_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KH='everlist.network ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFKc5w69IfRkVxN3sn0sVR5QXX1VC83dDQ9NvjlWzQlv'
          printf '%s\n' "$KH" > ~/.ssh/known_hosts
          printf '%s\n' "155.94.165.200 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFKc5w69IfRkVxN3sn0sVR5QXX1VC83dDQ9NvjlWzQlv" >> ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@everlist.network"
          $SSH 'cd /home/deploy/everlist && git pull --ff-only'
          printf 'EVERLIST_NLU_API_URL=%s\nEVERLIST_NLU_API_KEY=%s\nEVERLIST_NLU_MODEL=%s\nEVERLIST_FALLBACK_API_URL=%s\nEVERLIST_FALLBACK_API_KEY=%s\nEVERLIST_FALLBACK_MODEL=%s\n' "$NLU_URL" "$NLU_KEY" "$NLU_MODEL" "$FB_URL" "$FB_KEY" "$FB_MODEL" \
            | $SSH 'mkdir -p /home/deploy/everlist/.secrets && cat > /home/deploy/everlist/.secrets/llm.env && chmod 600 /home/deploy/everlist/.secrets/llm.env'
          $SSH 'systemctl restart everlist-webchat'
          echo deployed: $($SSH 'cd /home/deploy/everlist && git rev-parse --short HEAD')

      - name: Verify live
        run: |
          sleep 3
          curl -fsS https://everlist.network/api/health | tee /tmp/health.json
          python3 -c 'import json;d=json.load(open("/tmp/health.json"));assert d.get("nlu",{}).get("configured"),"nlu not configured";print("hub ok, nlu configured")'
